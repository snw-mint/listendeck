<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charts · listendeck.</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/shared/global.css" />
  <link rel="stylesheet" href="/charts/charts.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="header-logo">
        <img src="/logo.svg" alt="" class="header-logo-icon" />
        <span>listendeck<span class="logo-dot">.</span></span>
      </a>

      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme"></button>

        <nav id="header-nav" class="header-nav" aria-label="Tools">
          <a href="/" class="nav-link" data-route="/">Home</a>
          <a href="/charts/" class="nav-link" data-route="/charts">Charts</a>
          <a href="/match/" class="nav-link" data-route="/match">Match</a>
          <a href="/lyrics/" class="nav-link" data-route="/lyrics">Lyrics</a>
          <a href="/cards/" class="nav-link" data-route="/cards">Cards</a>
        </nav>

        <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="header-nav">
          <animate-icons name="menu" size="22"></animate-icons>
        </button>

        <a href="https://github.com/snw-mint/listendeck" target="_blank" rel="noopener noreferrer" class="github-corner" aria-label="GitHub Repository" title="GitHub">
          <animate-icons name="github" size="20"></animate-icons>
        </a>
      </div>
    </div>
  </header>

  <main class="result-main">
    <div id="charts-report">
      <section class="user-cover-section">
        <div class="cover-image-container" id="coverContainer">
          <img id="artistCover" alt="Top Artist Cover" class="cover-image" />
        </div>

        <div class="user-profile-container">
          <div class="user-info-wrapper">
            <div class="user-info-details">
              <h1 id="userDisplayName" class="user-display-name">User</h1>

              <div class="stats-cards-container">
                <div class="stat-card">
                  <span class="stat-title">Listens</span>
                  <span id="userScrobbles" class="stat-value">—</span>
                </div>
                <div class="stat-card">
                  <span class="stat-title">Minutes</span>
                  <span id="userMinutes" class="stat-value">—</span>
                </div>
                <div class="stat-card">
                  <span class="stat-title">Daily Avg</span>
                  <span id="userDailyAvg" class="stat-value">—</span>
                </div>
                <div class="stat-card">
                  <span class="stat-title">Vibe</span>
                  <span id="userVibe" class="stat-value">—</span>
                </div>
              </div>
            </div>

            <div class="charts-actions">
              <div class="period-tabs" role="tablist" aria-label="Time period">
                <button type="button" class="period-tab active" data-period="this_week">This Week</button>
                <button type="button" class="period-tab" data-period="week">Last Week</button>
                <button type="button" class="period-tab" data-period="this_month">This Month</button>
                <button type="button" class="period-tab" data-period="month">Last Month</button>
              </div>
              <button id="export-charts-btn" type="button" class="export-btn">
                <animate-icons name="download" size="18"></animate-icons>
                <span>Export</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="charts-section">
        <div class="charts-grid">
          <section class="chart-card" id="cardArtists">
            <h2>Top Artists</h2>
            <div class="lista-top" id="listTopArtists"></div>
          </section>

          <section class="chart-card" id="cardTracks">
            <h2>Top Songs</h2>
            <div class="lista-top" id="listTopTracks"></div>
          </section>

          <section class="chart-card" id="cardAlbums">
            <h2>Top Albums</h2>
            <div class="lista-top" id="listTopAlbums"></div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <strong>listendeck<span class="logo-dot">.</span></strong>
        <span>·</span>
        <span>by <a href="https://github.com/snw-mint/" target="_blank" rel="noopener noreferrer">Snow Mint</a></span>
        <span>·</span>
        <a href="https://github.com/snw-mint/listendeck/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">GPL-3.0</a>
      </div>
      <div class="footer-right">
        <a href="/privacy.html">Privacy Policy</a>
        <span>·</span>
        <a href="/terms.html">Terms of Use</a>
        <span>·</span>
        <div class="footer-powered">
          <span>Powered by</span>
          <a href="https://listenbrainz.org" target="_blank" rel="noopener noreferrer">ListenBrainz</a><span>,</span>
          <a href="https://lrclib.net" target="_blank" rel="noopener noreferrer">LRCLIB</a><span>&amp;</span>
          <a href="https://developers.deezer.com" target="_blank" rel="noopener noreferrer">Deezer</a>
        </div>
      </div>
    </div>
  </footer>

  <script type="module" src="/shared/header.js"></script>
  <script type="module" src="/charts/charts.js"></script>
</body>

</html>
