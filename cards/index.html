<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Cover Card Generator — listendeck.</title>
  <meta name="description"
    content="Search any track or album via Deezer to generate minimal music cover cards and 9:16 Stories with static or animated artwork right in your browser." />
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0E" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://listendeck.vercel.app/cards/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="listendeck." />
  <meta property="og:title" content="Music Cover Card Generator — listendeck." />
  <meta property="og:description"
    content="Search any track or album via Deezer to generate minimal music cover cards and 9:16 Stories with static or animated artwork right in your browser." />
  <meta property="og:url" content="https://listendeck.vercel.app/cards/" />
  <meta property="og:image" content="https://listendeck.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Music Cover Card Generator — listendeck." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Music Cover Card Generator — listendeck." />
  <meta name="twitter:description"
    content="Search any track or album via Deezer to generate minimal music cover cards and 9:16 Stories with static or animated artwork right in your browser." />
  <meta name="twitter:image" content="https://listendeck.vercel.app/og-image.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Music Cover Card Generator — listendeck.",
      "url": "https://listendeck.vercel.app/cards/",
      "description": "Search any track or album via Deezer to generate minimal music cover cards and 9:16 Stories with static or animated artwork right in your browser.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "isAccessibleForFree": true,
      "license": "https://www.gnu.org/licenses/gpl-3.0.html",
      "image": "https://listendeck.vercel.app/og-image.png",
      "author": {
        "@type": "Organization",
        "name": "Snow Mint",
        "url": "https://github.com/snw-mint"
      }
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/shared/global.css" />
  <link rel="stylesheet" href="/cards/cards.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="header-logo">
        <img src="/logo.svg" alt="" class="header-logo-icon" />
        <span>listendeck<span class="logo-dot">.</span></span>
      </a>

      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme"></button>

        <nav id="header-nav" class="header-nav" aria-label="Tools">
          <a href="/" class="nav-link" data-route="/">Home</a>
          <a href="/charts/" class="nav-link" data-route="/charts">Charts</a>
          <a href="/match/" class="nav-link" data-route="/match">Match</a>
          <a href="/lyrics/" class="nav-link" data-route="/lyrics">Lyrics</a>
          <a href="/cards/" class="nav-link" data-route="/cards">Cards</a>
        </nav>

        <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Open menu" aria-expanded="false"
          aria-controls="header-nav">
          <animate-icons name="menu" size="22"></animate-icons>
        </button>

        <a href="https://github.com/snw-mint/listendeck" target="_blank" rel="noopener noreferrer" class="github-corner"
          aria-label="GitHub Repository" title="GitHub">
          <animate-icons name="github" size="20"></animate-icons>
        </a>
      </div>
    </div>
  </header>

  <main class="tool-main">
    <div class="tool-split">
      <section class="tool-input-col">
        <h1 class="tool-title">Turn Any Track Or Album Into Cards<span class="logo-dot">.</span></h1>
        <p class="tool-description">
          Search any track or album to generate minimal music cards and 9:16 Stories with static or animated artwork.
        </p>

        <form id="cards-form" class="tool-form cards-search-form" autocomplete="off">
          <div class="search-dropdown-wrap" id="cards-search-wrap">
            <div class="input-pill cards-input-pill" id="cards-input-pill">
              <span class="search-leading-icon" aria-hidden="true">
                <animate-icons name="search" size="18"></animate-icons>
              </span>
              <input type="text" id="cards-query" placeholder="Track, album, or artist..." autocomplete="off"
                aria-autocomplete="list" aria-controls="cards-dropdown" aria-expanded="false" required />
              <button type="button" id="cards-clear-btn" class="search-clear-btn" aria-label="Clear search" hidden>
                <animate-icons name="x" size="16"></animate-icons>
              </button>
            </div>

            <div id="cards-dropdown" class="search-dropdown" role="listbox" hidden></div>
          </div>
          <p id="cards-error" class="form-error" role="alert" aria-live="polite"></p>
        </form>
      </section>

      <section class="tool-preview-col cards-preview-col" aria-label="Example preview">
        <div class="preview-music-stage" aria-hidden="true">
          <img src="/assets/preview/cards-mayhem.webp" alt="" class="preview-music-blur-bg" />
          <div class="music-card-wrapper preview-music-card-wrap">
            <div class="music-card-target preview-music-card-box">
              <div class="music-card-cover-container">
                <img src="/assets/preview/cards-mayhem.webp" alt="" class="music-card-cover-img" />
              </div>
              <div class="music-card-meta">
                <span class="music-card-title">MAYHEM</span>
                <span class="music-card-artist">Lady Gaga</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <strong>listendeck<span class="logo-dot">.</span></strong>
        <span>by <a href="https://github.com/snw-mint" target="_blank" rel="noopener noreferrer">Snow Mint</a></span>
        <span>·</span>
        <a href="https://github.com/snw-mint/listendeck/blob/main/LICENSE" target="_blank"
          rel="noopener noreferrer">GPL-3.0</a>
      </div>
      <div class="footer-right">
        <a href="/credits/">Credits</a>
        <span>·</span>
        <a href="https://github.com/snw-mint/listendeck/issues/new/choose" target="_blank" rel="noopener noreferrer" data-track="feedback_click">Feedback</a>
        <span>·</span>
        <a href="https://github.com/snw-mint/listendeck" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

  <script type="module" src="/shared/header.js"></script>
  <script type="module" src="/cards/cards.js"></script>
</body>

</html>
