<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics · listendeck.</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/shared/global.css" />
  <link rel="stylesheet" href="/lyrics/lyrics.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="header-logo">
        <img src="/logo.svg" alt="" class="header-logo-icon" />
        <span>listendeck<span class="logo-dot">.</span></span>
      </a>

      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme"></button>

        <nav id="header-nav" class="header-nav" aria-label="Tools">
          <a href="/" class="nav-link" data-route="/">Home</a>
          <a href="/charts/" class="nav-link" data-route="/charts">Charts</a>
          <a href="/match/" class="nav-link" data-route="/match">Match</a>
          <a href="/lyrics/" class="nav-link" data-route="/lyrics">Lyrics</a>
          <a href="/cards/" class="nav-link" data-route="/cards">Cards</a>
        </nav>

        <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="header-nav">
          <animate-icons name="menu" size="22"></animate-icons>
        </button>

        <a href="https://github.com/snw-mint/listendeck" target="_blank" rel="noopener noreferrer" class="github-corner" aria-label="GitHub Repository" title="GitHub">
          <animate-icons name="github" size="20"></animate-icons>
        </a>
      </div>
    </div>
  </header>

  <main class="tool-main">
    <div class="tool-split">
      <section class="tool-input-col">
        <h1 class="tool-title">Lyrics</h1>
        <p class="tool-description">
          Search track lyrics via LRCLIB and export clean cards inspired by your favorite streaming layouts.
        </p>
        <form id="lyrics-form" class="tool-form">
          <div class="input-pill">
            <input type="text" id="lyrics-query" placeholder="Track or artist name" autocomplete="off" required />
            <button type="submit" class="input-pill-btn">Search</button>
          </div>
        </form>
      </section>

      <section class="tool-preview-col" aria-label="Example preview"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <strong>listendeck<span class="logo-dot">.</span></strong>
        <span>·</span>
        <span>by <a href="https://github.com/snw-mint/" target="_blank" rel="noopener noreferrer">Snow Mint</a></span>
        <span>·</span>
        <a href="https://github.com/snw-mint/listendeck/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">GPL-3.0</a>
      </div>
      <div class="footer-right">
        <a href="/privacy.html">Privacy Policy</a>
        <span>·</span>
        <a href="/terms.html">Terms of Use</a>
        <span>·</span>
        <div class="footer-powered">
          <span>Powered by</span>
          <a href="https://listenbrainz.org" target="_blank" rel="noopener noreferrer">ListenBrainz</a><span>,</span>
          <a href="https://lrclib.net" target="_blank" rel="noopener noreferrer">LRCLIB</a><span>&amp;</span>
          <a href="https://developers.deezer.com" target="_blank" rel="noopener noreferrer">Deezer</a>
        </div>
      </div>
    </div>
  </footer>

  <script type="module" src="/shared/header.js"></script>
  <script type="module" src="/lyrics/lyrics.js"></script>
</body>

</html>
